<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BandLab｜半導體能隙互動實驗室</title>
<meta name="description" content="互動式半導體能隙實驗室：調整材料、波長與溫度，觀察光子吸收、E–k 能帶結構與吸收邊。可離線使用。">
<meta name="theme-color" content="#EEF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101830" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#16213A; --muted:#56628A;
  --line:#D4D9E4; --vb:#22325C; --cb:#3E64A9; --gapc:#E7EAF1;
  --ok:#17785A; --no:#A63A3A; --electron:#F2B400;
  --beam:#E5382F;
  --font:"Sora","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101830; --surface:#18223F; --surface-2:#1E2A4C; --ink:#E8ECF7; --muted:#9AA6C6;
    --line:#2C3963; --vb:#2D4380; --cb:#4E7BD0; --gapc:#141D38;
    --ok:#4CC79A; --no:#F07C7C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101830; --surface:#18223F; --surface-2:#1E2A4C; --ink:#E8ECF7; --muted:#9AA6C6;
  --line:#2C3963; --vb:#2D4380; --cb:#4E7BD0; --gapc:#141D38;
  --ok:#4CC79A; --no:#F07C7C; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth;height:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--beam);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:700;letter-spacing:-.01em;font-size:1.1rem;margin-right:auto}
.brand small{display:none;font-weight:400;color:var(--muted);font-size:.85rem}
@media (min-width:560px){.brand small{display:inline}}
.deskNav{display:none;gap:4px}
.deskNav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:.92rem}
.deskNav a[aria-current="true"]{color:var(--ink);background:var(--surface)}
.iconBtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem}
.iconBtn[hidden]{display:none}
.iconBtn svg{width:18px;height:18px}
@media (min-width:900px){.deskNav{display:flex}}

/* bottom tab bar on phones */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:.72rem}
.tabbar a svg{width:22px;height:22px}
.tabbar a[aria-current="true"]{color:var(--ink);font-weight:600}
.tabbar a[aria-current="true"] svg{color:var(--beam)}
@media (min-width:900px){.tabbar{display:none}}
main{padding-bottom:88px}
@media (min-width:900px){main{padding-bottom:40px}}

/* intro */
.intro{padding:28px 0 18px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.intro h1{margin:0;font-size:clamp(1.7rem,4.6vw,2.9rem);line-height:1.12;letter-spacing:-.02em;font-weight:700;max-width:18ch}
.intro p{margin:0;color:var(--muted);max-width:62ch}
.formula{display:inline-flex;align-items:baseline;gap:.35em;font-weight:600;font-size:1.05rem;padding:6px 14px 6px 12px;border-left:4px solid var(--beam);background:var(--surface);border-radius:0 8px 8px 0;width:max-content;max-width:100%;flex-wrap:wrap}
.formula span{color:var(--muted);font-weight:400;font-size:.85rem}

section{padding:28px 0}
section h2{font-size:clamp(1.3rem,2.6vw,1.7rem);margin:0 0 6px;letter-spacing:-.015em;line-height:1.2}
section .lede{margin:0 0 18px;color:var(--muted);max-width:66ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,2.4vw,22px);min-width:0}
.panel h3{margin:0 0 10px;font-size:1rem;font-weight:600}

/* lab layout */
.lab{display:grid;gap:16px;grid-template-areas:"viz" "ctrl"}
.lab .viz{grid-area:viz}
.lab .ctrl{grid-area:ctrl;display:grid;gap:16px;align-content:start}
@media (min-width:900px){.lab{grid-template-columns:minmax(330px,400px) 1fr;grid-template-areas:"ctrl viz"}
  .lab .viz{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start}}

.fieldHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.fieldHead label,.fieldHead h3{font-weight:600;font-size:1rem;margin:0}
.fieldHead .val{font-weight:600;font-size:1.05rem}
.matGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 4px 6px;text-align:center;line-height:1.2;transition:background .15s,border-color .15s}
.chip b{display:block;font-size:.9rem;font-weight:600}
.chip i{display:block;font-style:normal;font-size:.72rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] i{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.chip:hover{border-color:var(--muted)}
.matInfo{margin:12px 0 0;font-size:.88rem;color:var(--muted)}
.matInfo strong{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);margin-left:6px;color:var(--ink);vertical-align:1px}

.spec{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:999px;margin:4px 0 2px;background:linear-gradient(90deg,#333,#999);outline-offset:4px}
.spec::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--beam);border:4px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.spec::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--beam);border:4px solid #fff;box-shadow:0 0 0 1.5px var(--ink)}
.specScale{position:relative;height:18px;font-size:.7rem;color:var(--muted)}
.specScale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.temp{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:linear-gradient(90deg,#5B8FE0,#B9C3D8 45%,#E0703C);margin:10px 0}
.temp::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.temp::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numIn{width:96px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface-2)}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.presets{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-top:10px;scrollbar-width:thin}
.preset{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px 4px 8px;font-size:.8rem;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.preset .dot{width:10px;height:10px;border-radius:50%}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}

/* viz */
.cvWrap{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--gapc)}
@media (min-width:600px){.cvWrap{aspect-ratio:16/10}}
.cvWrap canvas{position:absolute;inset:0;width:100%;height:100%}
.verdict{display:flex;align-items:center;gap:10px;margin:14px 0 12px;padding:10px 14px;border-radius:10px;border-left:5px solid var(--beam);background:color-mix(in srgb,var(--beam) 12%,var(--surface));font-weight:600}
.verdict svg{flex:0 0 22px;height:22px}
.readouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.readouts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ro{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.ro span{display:block;font-size:.78rem;color:var(--muted)}
.ro b{display:block;font-size:1.3rem;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.ro b small{font-size:.75rem;font-weight:400;color:var(--muted);margin-left:2px}
.vizFoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.vizFoot p{margin:0;font-size:.8rem;color:var(--muted)}

/* physics */
.duo{display:grid;gap:16px}
@media (min-width:900px){.duo{grid-template-columns:1fr 1fr}}
.duo .cvWrap{aspect-ratio:5/4}
.note{margin:12px 0 0;font-size:.9rem;color:var(--muted)}
.note strong{color:var(--ink)}

/* compare */
.cmp{display:grid;gap:4px}
.cRow{display:grid;grid-template-columns:76px 1fr 58px;align-items:center;gap:10px;border:0;background:none;padding:3px 4px;border-radius:8px;text-align:left;width:100%}
@media (min-width:600px){.cRow{grid-template-columns:150px 1fr 70px}}
.cRow:hover{background:var(--surface-2)}
.cRow[aria-pressed="true"]{background:color-mix(in srgb,var(--beam) 10%,var(--surface-2))}
.cName{font-weight:600;font-size:.9rem;line-height:1.2}
.cName small{display:none;font-weight:400;color:var(--muted);font-size:.78rem}
@media (min-width:600px){.cName small{display:block}}
.track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}
.bar{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--cb) 45%,transparent);transition:width .3s,background .2s}
.bar.on{background:var(--beam)}
.cur{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.cEg{text-align:right;font-size:.85rem}
.axisRow{display:grid;grid-template-columns:76px 1fr 58px;gap:10px;margin-bottom:6px}
@media (min-width:600px){.axisRow{grid-template-columns:150px 1fr 70px}}
.axis{position:relative;height:34px}
.axis .vis{position:absolute;top:0;height:8px;border-radius:2px}
.axis span{position:absolute;top:12px;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}
@media (max-width:599px){.axis .minor{display:none}}
.cmpCount{font-weight:600;margin:14px 0 0}

/* quiz */
.quiz{max-width:760px}
.qStats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:.9rem;color:var(--muted)}
.qStats b{color:var(--ink);font-size:1.05rem}
.qText{font-size:1.12rem;font-weight:600;margin:0 0 14px;line-height:1.45}
.opts{display:grid;gap:8px}
@media (min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 14px;min-height:52px}
.opt kbd{font-family:inherit;font-size:.75rem;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted);background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--surface))}
.feedback{margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.feedback[hidden]{display:none}
.feedback strong{display:block;margin-bottom:2px}
.qActions{margin-top:14px;display:flex;gap:8px}

footer{border-top:1px solid var(--line);padding:22px 0 28px;color:var(--muted);font-size:.82rem}
footer p{margin:0 0 6px;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:50;transition:.25s;pointer-events:none;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:6px;padding:4px 10px;font-size:.82rem}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#lab" aria-label="BandLab">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><rect x="6" y="7" width="20" height="5" rx="1.5" fill="#5E8BE0"/><rect x="6" y="21" width="20" height="5" rx="1.5" fill="#8EA3D6"/><path d="M16 20.5V13" stroke="var(--electron)" stroke-width="2.4" stroke-linecap="round"/><path d="M12.8 15.6 16 12.4l3.2 3.2" fill="none" stroke="var(--electron)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      BandLab <small data-i18n="brandSub"></small>
    </a>
    <nav class="deskNav" aria-label="Sections">
      <a href="#lab" data-i18n="navLab"></a><a href="#physics" data-i18n="navPhys"></a><a href="#compare" data-i18n="navCmp"></a><a href="#quiz" data-i18n="navQuiz"></a>
    </nav>
    <button class="iconBtn" id="installBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><span data-i18n="install"></span></button>
    <button class="iconBtn" id="langBtn" aria-label="Language"></button>
    <button class="iconBtn" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="intro">
      <h1 data-i18n="h1"></h1>
      <p data-i18n="lede"></p>
      <div class="formula">E<sub>photon</sub> (eV) = 1240 / λ (nm) <span data-i18n="formulaNote"></span></div>
    </div>

    <section id="lab" aria-labelledby="labH">
      <h2 id="labH" class="sr" data-i18n="navLab"></h2>
      <div class="lab">
        <div class="viz panel">
          <div class="fieldHead"><h3 data-i18n="bandTitle"></h3><span class="tag" id="typeTag"></span></div>
          <div class="cvWrap"><canvas id="bandCv" role="img" aria-describedby="verdictText"></canvas></div>
          <div class="verdict" id="verdict" aria-live="polite"><svg id="verdictIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"></svg><span id="verdictText"></span></div>
          <div class="readouts">
            <div class="ro"><span data-i18n="phEnergy"></span><b class="num" id="roEph"></b></div>
            <div class="ro"><span data-i18n="bandgap"></span><b class="num" id="roEg"></b></div>
            <div class="ro"><span data-i18n="cutoff"></span><b class="num" id="roLg"></b></div>
            <div class="ro"><span id="roDLabel"></span><b class="num" id="roD"></b></div>
          </div>
          <div class="vizFoot">
            <p id="vizNote"></p>
            <div class="row"><button class="btn" id="pauseBtn"></button><button class="btn" id="shareBtn" data-i18n="share"></button></div>
          </div>
        </div>

        <div class="ctrl">
          <div class="panel">
            <div class="fieldHead"><h3 id="matLabel" data-i18n="material"></h3></div>
            <div class="matGrid" id="matGrid" role="group" aria-labelledby="matLabel"></div>
            <p class="matInfo" id="matInfo"></p>
          </div>
          <div class="panel">
            <div class="fieldHead"><label for="lamRange" data-i18n="wavelength"></label><span class="val num" id="lamVal"></span></div>
            <input type="range" class="spec" id="lamRange" min="0" max="1000" step="1">
            <div class="specScale" id="specScale" aria-hidden="true"></div>
            <div class="row" style="margin-top:8px">
              <label class="sr" for="lamNum" data-i18n="wavelength"></label>
              <input type="number" class="numIn num" id="lamNum" min="200" max="8000" step="1" inputmode="numeric"> <span>nm</span>
              <button class="btn" id="cutoffBtn" data-i18n="jumpCutoff"></button>
            </div>
            <div class="presets" id="presets" role="group" aria-label="Presets"></div>
          </div>
          <div class="panel">
            <div class="fieldHead"><label for="tRange" data-i18n="temperature"></label><span class="val num" id="tVal"></span></div>
            <input type="range" class="temp" id="tRange" min="4" max="600" step="1">
            <div class="row"><button class="btn" data-t="77" data-i18n="t77"></button><button class="btn" data-t="300" data-i18n="t300"></button><button class="btn" data-t="500" data-i18n="t500"></button></div>
            <p class="hint" id="tHint"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="physics" aria-labelledby="physH">
      <h2 id="physH" data-i18n="physTitle"></h2>
      <p class="lede" data-i18n="physLede"></p>
      <div class="duo">
        <div class="panel">
          <h3 data-i18n="ekTitle"></h3>
          <div class="cvWrap"><canvas id="ekCv" role="img" aria-describedby="ekNote"></canvas></div>
          <p class="note" id="ekNote"></p>
        </div>
        <div class="panel">
          <h3 data-i18n="absTitle"></h3>
          <div class="cvWrap"><canvas id="absCv" role="img" aria-describedby="absNote"></canvas></div>
          <p class="note" id="absNote"></p>
        </div>
      </div>
    </section>

    <section id="compare" aria-labelledby="cmpH">
      <h2 id="cmpH" data-i18n="cmpTitle"></h2>
      <p class="lede" data-i18n="cmpLede"></p>
      <div class="panel">
        <div class="axisRow" aria-hidden="true"><div></div><div class="axis" id="cmpAxis"></div><div></div></div>
        <div class="cmp" id="cmpList"></div>
        <p class="cmpCount" id="cmpCount" aria-live="polite"></p>
      </div>
    </section>

    <section id="quiz" aria-labelledby="quizH">
      <h2 id="quizH" data-i18n="quizTitle"></h2>
      <p class="lede" data-i18n="quizLede"></p>
      <div class="panel quiz">
        <div class="qStats"><span><span data-i18n="score"></span> <b class="num" id="qScore">0 / 0</b></span><span><span data-i18n="streak"></span> <b class="num" id="qStreak">0</b></span><span><span data-i18n="best"></span> <b class="num" id="qBest">0</b></span></div>
        <p class="qText" id="qText"></p>
        <div class="opts" id="qOpts"></div>
        <div class="feedback" id="qFb" hidden aria-live="polite"></div>
        <div class="qActions"><button class="btn primary" id="qNext" data-i18n="next"></button></div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p data-i18n="foot1"></p>
    <p id="iosHint" hidden data-i18n="iosHint"></p>
  </div>

const easeOut=x=>1-Math.pow(1-x,3), easeIn=x=>x*x;

/* ---------- E-k diagram ---------- */
function drawEK(o){
  const {ctx,w,h}=o; if(!w) return; ctx.clearRect(0,0,w,h);
  const m=mat(), Eg=egAt(m,S.T), Egd=egdAt(m,S.T), Eph=eOf(S.lam), dir=m.t==="d", col=spectral(S.lam);
  const sc=Math.max(Eg,0.8);
  const cv=0.9*sc, cc=1.1*sc, k0=0.68;
  const VB=k=>-cv*k*k;
  const CB=k=> dir ? Eg+cc*k*k : Egd+cc*k*k-(Egd-Eg+cc*k0*k0)*Math.exp(-Math.pow(Math.abs(k)-k0,2)/0.045);
  const top=Math.max(Egd,Eph,Eg)*1.12+0.25*sc, bot=-0.95*sc;
  const L=40,R=w-14,T=14,B=h-28;
  const X=k=>L+(k+1)/2*(R-L), Y=E=>B-(E-bot)/(top-bot)*(B-T);
  ctx.fillStyle=C.gap; ctx.fillRect(0,0,w,h);
  // axes
  ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(X(0),T); ctx.lineTo(X(0),B); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.stroke();
  ctx.fillStyle=C.muted; ctx.font=FONT(12); ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillText("Γ (k = 0)",X(0),B+6); ctx.fillText("k →",R-14,B+6); ctx.fillText("← k",L+14,B+6);
  ctx.save();ctx.translate(14,(T+B)/2);ctx.rotate(-Math.PI/2);ctx.textBaseline="middle";ctx.fillText("E",0,0);ctx.restore();
  // curves
  const curve=(f,c,clip)=>{ctx.save();ctx.strokeStyle=c;ctx.lineWidth=3;ctx.beginPath();let first=true;for(let i=0;i<=240;i++){const k=-1+2*i/240,E=f(k);if(E>top||E<bot){first=true;continue}first?ctx.moveTo(X(k),Y(E)):ctx.lineTo(X(k),Y(E));first=false}ctx.stroke();ctx.restore()};
  curve(VB,C.vb); curve(CB,C.cb);
  ctx.fillStyle=C.cb; ctx.font=FONT(12); ctx.textAlign="center"; ctx.textBaseline="top";
  ctx.fillText("CB",X(dir?-0.55:-k0),Y(dir?CB(-0.55):Eg)+8);
  ctx.fillStyle=C.vb; ctx.textBaseline="top"; ctx.fillText("VB",X(0.62),Y(VB(0.62))+4);
  // gap marks
  const kMin = dir?0:k0;
  ctx.save(); ctx.setLineDash([3,4]); ctx.strokeStyle=C.muted; ctx.beginPath(); ctx.moveTo(X(-1),Y(0)); ctx.lineTo(X(1),Y(0)); ctx.moveTo(X(-1),Y(Eg)); ctx.lineTo(X(1),Y(Eg)); ctx.stroke(); ctx.restore();
  ctx.fillStyle=C.muted; ctx.font=FONT(11); ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText("0",L-6,Y(0)); ctx.fillText(fmt(Eg),L-6,Y(Eg));
  // transition
  const tag=dir?t("direct"):t("indirect");
  ctx.fillStyle=C.ink; ctx.font=FONT(13); ctx.textAlign="left"; ctx.textBaseline="top"; ctx.fillText(nameOf(m)+"  "+tag,L+6,T+2);
  if(dir || Eph>=Egd){
    const gap0 = dir?Eg:Egd;
    if(Eph>=gap0){
      // vertical transition where CB-VB = Eph
      let kk=0; if(dir) kk=Math.sqrt(Math.max(0,(Eph-Eg)/(cc+cv))); else { // search near 0
        let lo=0,hi=0.6; for(let i=0;i<40;i++){const mid=(lo+hi)/2; (CB(mid)-VB(mid)<Eph)?lo=mid:hi=mid} kk=lo; }
      kk=Math.min(kk,0.95);
      arrow(ctx,X(kk),Y(VB(kk))-2,X(kk),Y(Math.min(CB(kk),top))+6,rgb(col),3);
      ctx.fillStyle=C.el; ctx.beginPath(); ctx.arc(X(kk),Y(Math.min(CB(kk),top)),6,0,7); ctx.fill();
      ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(X(kk),Y(VB(kk)),6,0,7); ctx.stroke();
      ctx.fillStyle=C.ink; ctx.font=FONT(12); ctx.textAlign=kk>0.45?"right":"left"; ctx.textBaseline="middle"; ctx.fillText(t("photon")+" "+S.lam+" nm",X(kk)+(kk>0.45?-10:10),(Y(VB(kk))+Y(Math.min(CB(kk),top)))/2);
      return;
    }
  }
  if(!dir && Eph>=Eg){
    const yTop=Y(Eph);
    arrow(ctx,X(0),Y(0)-2,X(0),yTop+6,rgb(col),3);
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(X(0),Y(0),6,0,7); ctx.stroke();
    let lo=k0,hi=1; for(let i=0;i<40;i++){const mid=(lo+hi)/2; (CB(mid)<Eph)?lo=mid:hi=mid} const kEnd=Math.min(lo,0.98);

    ctx.fillStyle=C.el; ctx.beginPath(); ctx.arc(X(kEnd),Y(CB(kEnd)),6,0,7); ctx.fill();
    ctx.fillStyle=C.ink; ctx.font=FONT(12); ctx.textAlign="center"; ctx.textBaseline="bottom"; ctx.fillText(t("phonon"),(X(0)+X(kEnd))/2,yTop-8);

/* ---------- absorption edge ---------- */
function absModel(m,E,T){ const Eg=egAt(m,T); if(E<Eg) return 0; if(m.t==="d") return Math.sqrt(E-Eg); const Egd=egdAt(m,T); return 0.09*Math.pow(E-Eg,2)+(E>Egd?Math.sqrt(E-Egd):0); }
function drawAbs(o){
  const {ctx,w,h}=o; if(!w) return; ctx.clearRect(0,0,w,h);
  const m=mat(), Eg=egAt(m,S.T), Eph=eOf(S.lam), col=spectral(S.lam);
  const xmax=clamp(Math.max(Eg*1.9,Eph*1.08,Eg+1.4),1.6,7.6), xmin=Math.max(0,Math.min(Eg*0.55,Eph*0.9)), ymax=1.6;
  const L=40,R=w-14,T=30,B=h-30, X=E=>L+(E-xmin)/(xmax-xmin)*(R-L), Y=v=>B-Math.min(v,ymax)/ymax*(B-T);
  ctx.fillStyle=C.gap; ctx.fillRect(0,0,w,h);
  // visible strip
  for(let x=L;x<=R;x++){const E=xmin+(x-L)/(R-L)*(xmax-xmin),l=HC/E;if(l>=380&&l<=780){ctx.fillStyle=rgb(spectral(l));ctx.fillRect(x,B,1.2,5)}}
  // grid & ticks
  ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L,B); ctx.lineTo(R,B); ctx.moveTo(L,T); ctx.lineTo(L,B); ctx.stroke();
  ctx.fillStyle=C.muted; ctx.font=FONT(11); ctx.textAlign="center"; ctx.textBaseline="top";
  const st=niceStep(xmax-xmin,6); for(let e=Math.ceil(xmin/st)*st;e<=xmax+1e-9;e+=st){ctx.fillText(fmt(e,st<1?1:0),X(e),B+8)}

  ctx.textBaseline="bottom"; ctx.textAlign="center";
  [8000,4000,2000,1500,1000,800,600,500,400,300,250,200].forEach(l=>{const E=HC/l;if(E>xmin+.02&&E<xmax-.02){ctx.fillText(l,X(E),T-8);ctx.beginPath();ctx.moveTo(X(E),T-6);ctx.lineTo(X(E),T-2);ctx.stroke()}});
  ctx.textAlign="right"; ctx.fillText("nm",R,T-20);
  ctx.save();ctx.translate(14,(T+B)/2);ctx.rotate(-Math.PI/2);ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t("absAxis"),0,0);ctx.restore();
  // reference curve of opposite type
  const ref = mat(m.t==="d"?"Si":"GaAs");
  const plot=(mm,stroke,fill,dash)=>{ctx.save();ctx.beginPath();ctx.moveTo(X(xmin),Y(0));for(let i=0;i<=300;i++){const E=xmin+(xmax-xmin)*i/300;ctx.lineTo(X(E),Y(absModel(mm,E,S.T)))}if(fill){ctx.lineTo(X(xmax),Y(0));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.beginPath();for(let i=0;i<=300;i++){const E=xmin+(xmax-xmin)*i/300;i?ctx.lineTo(X(E),Y(absModel(mm,E,S.T))):ctx.moveTo(X(E),Y(absModel(mm,E,S.T)))}}ctx.strokeStyle=stroke;ctx.lineWidth=dash?1.5:2.6;if(dash)ctx.setLineDash(dash);ctx.stroke();ctx.restore()};
  if(ref.id!==m.id) plot(ref,C.muted,null,[4,4]);
  ctx.globalAlpha=.22; plot(m,C.cb,C.cb); ctx.globalAlpha=1; plot(m,C.cb);
  // legend
  ctx.font=FONT(11); ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillStyle=C.cb; ctx.fillRect(L+10,T+10,14,3); ctx.fillStyle=C.ink; ctx.fillText(nameOf(m),L+30,T+11);
  if(ref.id!==m.id){ctx.strokeStyle=C.muted;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(L+10,T+28);ctx.lineTo(L+24,T+28);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=C.muted;ctx.fillText(nameOf(ref),L+30,T+28)}

}

$("#langBtn").addEventListener("click",()=>{S.lang=S.lang==="zh"?"en":"zh";store.set("lang",S.lang);applyLang();update();renderQuiz()});

/* ---------- share ---------- */
function toast(msg,actionLabel,action){const el=$("#toast");el.innerHTML="";const s=document.createElement("span");s.textContent=msg;el.appendChild(s);if(actionLabel){const b=document.createElement("button");b.textContent=actionLabel;b.onclick=action;el.appendChild(b)}el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),actionLabel?9000:2600)}
$("#shareBtn").addEventListener("click",async()=>{const url=location.href.split("#")[0];try{if(navigator.share&&matchMedia("(pointer:coarse)").matches){await navigator.share({title:"BandLab",url});return}await navigator.clipboard.writeText(url);toast(t("copied"))}catch(e){}});

/* ---------- nav highlight ---------- */
const navLinks=document.querySelectorAll(".deskNav a,.tabbar a");
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){navLinks.forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+e.target.id))}})},{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("main section").forEach(s=>io.observe(s));

/* ---------- quiz ---------- */
const Q={score:0,total:0,streak:0,best:store.get("best",0),cur:null,answered:false};
const T0=300, rnd=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const GEN={
  energy(){const l=rnd([254,365,405,450,532,650,850,1064,1310,1550]),e=HC/l;const opts=[e,e*1.6,e*0.55,l/1240*1.0+0.05].map(x=>fmt(x)+" eV");return{q:t("q_energy",{lam:l}),opts,ans:0,x:t("x_energy",{lam:l,e:fmt(e)}),set:{lam:l}}},
  absorb(){for(let tries=0;tries<30;tries++){const l=rnd([450,532,650,850,1064,1310,1550,3000]);const yes=MATS.filter(m=>HC/egAt(m,T0)>=l*1.03),no=MATS.filter(m=>HC/egAt(m,T0)<l*0.97);if(yes.length&&no.length>=3){const y=rnd(yes),ns=shuffle([...no]).slice(0,3);return{q:t("q_absorb",{lam:l}),opts:[y,...ns].map(nameOf),ans:0,x:t("x_absorb",{m:nameOf(y),lg:Math.round(HC/egAt(y,T0)),lam:l}),set:{m:y.id,lam:l,T:300}}}}return GEN.energy()},
  cutoff(){const m=rnd(MATS.filter(m=>egAt(m,T0)>0.5)),e=egAt(m,T0),lg=HC/e;const opts=[lg,lg*0.62,lg*1.55,1240*e].map(x=>Math.round(x)+" nm");return{q:t("q_cutoff",{m:nameOf(m),eg:fmt(e)}),opts,ans:0,x:t("x_cutoff",{eg:fmt(e),lg:Math.round(lg)}),set:{m:m.id,T:300}}},
  indirect(){const i=rnd(MATS.filter(m=>m.t==="i")),ds=shuffle(MATS.filter(m=>m.t==="d")).slice(0,3);return{q:t("q_indirect"),opts:[i,...ds].map(nameOf),ans:0,x:t("x_indirect",{m:nameOf(i)}),set:{m:i.id}}},
  temp(){return{q:t("q_temp"),opts:[...t("o_temp")],ans:0,x:t("x_temp"),set:{m:"Si",T:500}}},
  excess(){const m=rnd(MATS.filter(m=>{const e=egAt(m,T0);return e>0.6&&e<2.6})),l=rnd([254,365,405,450]),d=HC/l-egAt(m,T0);return{q:t("q_excess",{lam:l,m:nameOf(m)}),opts:[...t("o_excess")],ans:0,x:t("x_excess",{d:fmt(d)}),set:{m:m.id,lam:l,T:300}}},
  led(){return{q:t("q_led"),opts:["GaN","Si","Ge","InSb"],ans:0,x:t("x_led",{lg:Math.round(HC/egAt(mat("GaN"),T0))}),set:{m:"GaN",lam:Math.round(HC/egAt(mat("GaN"),T0))}}}
};
let lastKind="";
function newQuestion(){let k;do{k=rnd(Object.keys(GEN))}while(k===lastKind);lastKind=k;const g=GEN[k]();const order=shuffle([0,1,2,3]);Q.cur={kind:k,q:g.q,opts:order.map(i=>g.opts[i]),ans:order.indexOf(g.ans),x:g.x,set:g.set,seed:k};Q.answered=false;renderQuiz()}
function renderQuiz(){if(!Q.cur)return;$("#qText").textContent=Q.cur.q;const box=$("#qOpts");box.innerHTML="";
  Q.cur.opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<kbd>${i+1}</kbd><span></span>`;b.querySelector("span").textContent=o;b.addEventListener("click",()=>answer(i));if(Q.answered){b.disabled=true;if(i===Q.cur.ans)b.classList.add("right");else if(i===Q.cur.pick)b.classList.add("wrong")}box.appendChild(b)});
  $("#qScore").textContent=Q.score+" / "+Q.total;$("#qStreak").textContent=Q.streak;$("#qBest").textContent=Q.best;
  const fb=$("#qFb");if(Q.answered){fb.hidden=false;fb.innerHTML="";const s=document.createElement("strong");s.textContent=Q.cur.pick===Q.cur.ans?t("correct"):t("wrong");s.style.color=Q.cur.pick===Q.cur.ans?"var(--ok)":"var(--no)";const p=document.createElement("span");p.textContent=Q.cur.x;fb.append(s,p)}else fb.hidden=true;}
function answer(i){if(Q.answered)return;Q.answered=true;Q.cur.pick=i;Q.total++;if(i===Q.cur.ans){Q.score++;Q.streak++;if(Q.streak>Q.best){Q.best=Q.streak;store.set("best",Q.best)}}else Q.streak=0;
  // sync lab so the explanation is visible above
  const s=Q.cur.set||{};if(s.m)S.m=s.m;if(s.lam)S.lam=s.lam;if(s.T)S.T=s.T;update();renderQuiz();$("#qNext").focus({preventScroll:true});}
$("#qNext").addEventListener("click",newQuestion);
document.addEventListener("keydown",e=>{const quiz=$("#quiz").getBoundingClientRect();if(quiz.top>innerHeight*0.8||quiz.bottom<0)return;if(e.target.matches("input"))return;
  if(/^[1-4]$/.test(e.key)&&!Q.answered){answer(+e.key-1)}else if(e.key==="Enter"&&Q.answered&&e.target.id!=="qNext"){newQuestion()}});

/* ---------- PWA ---------- */
let deferred=null; const installBtn=$("#installBtn");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;installBtn.hidden=false});
installBtn.addEventListener("click",async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;installBtn.hidden=true});
window.addEventListener("appinstalled",()=>{installBtn.hidden=true});
const isStandalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const hasManifest=!!document.querySelector('link[rel="manifest"]');
if(hasManifest && /iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone) $("#iosHint").hidden=false;
if(hasManifest && "serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{const nw=reg.installing;nw&&nw.addEventListener("statechange",()=>{if(nw.state==="installed"){if(navigator.serviceWorker.controller){toast(t("update"),t("reload"),()=>{nw.postMessage("skipWaiting")})}else{toast(t("offline"))}}})});
  }).catch(()=>{});
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded||!hadCtl)return;reloaded=true;location.reload()});});
}

/* ---------- init ---------- */
readColors(); applyTheme(); applyLang(); update(); newQuestion();
})();
</script>
</body>
</html>
